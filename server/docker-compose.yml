name: travel-assistant

# Shared lab database: sqladminlab.database.windows.net / lab2DB (global-settings.env)
x-api-env: &api_env_file
  env_file:
    - global-settings.env

services:
  # Optional local SQL — only with: docker compose --profile local-sql up
  mssql:
    profiles: [local-sql]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - mssql-data:/var/opt/mssql

  # Creates Initial Catalog used by CONNECTIONSTRINGS__DEFAULTCONNECTION (default lab2DB in .env.docker.example).
  mssql-init:
    profiles: [local-sql]
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        until /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; do sleep 2; done
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "IF DB_ID('lab2DB') IS NULL CREATE DATABASE lab2DB"
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -d lab2DB -i /scripts/lab2DB-memberb-bootstrap.sql
    volumes:
      - ./Scripts/lab2DB-memberb-bootstrap.sql:/scripts/lab2DB-memberb-bootstrap.sql:ro
    restart: "no"

  apigateway:
    build:
      context: ..
      dockerfile: server/ApiGateway/Dockerfile
    ports:
      - "5161:8080"
    <<: *api_env_file
    environment: &service_env
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      Cors__AllowedOrigins__0: "${CORS__ALLOWEDORIGINS__0:-http://localhost:5173}"
      Cors__AllowedOrigins__1: "${CORS__ALLOWEDORIGINS__1:-http://127.0.0.1:5173}"
      Cors__AllowedOrigins__2: "${CORS__ALLOWEDORIGINS__2:-http://localhost:5174}"
      Cors__AllowedOrigins__3: "${CORS__ALLOWEDORIGINS__3:-http://127.0.0.1:5174}"
      AuditService__BaseUrl: "http://auditservice:8080/"
      Audit__InternalKey: "${AUDIT__INTERNALKEY:-dev-audit-internal-key}"
      NotificationService__BaseUrl: "http://notificationservice:8080/"
      Notification__InternalKey: "${NOTIFICATION__INTERNALKEY:-dev-notification-internal-key}"
      ReverseProxy__Clusters__user-cluster__Destinations__destination1__Address: "http://userservice:8080/"
      ReverseProxy__Clusters__itinerary-cluster__Destinations__destination1__Address: "http://itineraryservice:8080/"
      ReverseProxy__Clusters__booking-cluster__Destinations__destination1__Address: "http://bookingservice:8080/"
      ReverseProxy__Clusters__payment-cluster__Destinations__destination1__Address: "http://paymentservice:8080/"
      ReverseProxy__Clusters__notification-cluster__Destinations__destination1__Address: "http://notificationservice:8080/"
      ReverseProxy__Clusters__audit-cluster__Destinations__destination1__Address: "http://auditservice:8080/"
      ReverseProxy__Clusters__rtc-cluster__Destinations__destination1__Address: "http://realtimecommunicationservice:8080/"
      ReverseProxy__Clusters__weather-cluster__Destinations__destination1__Address: "http://weatherexternaldataservice:8080/"
      ReverseProxy__Clusters__support-cluster__Destinations__destination1__Address: "http://supportservice:8080/"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME:-root}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:-changeme}"

  userservice:
    <<: *api_env_file
    build:
      context: ..
      dockerfile: server/Services/UserService/Dockerfile
    ports:
      - "62381:8080"
    environment: *service_env

  itineraryservice:
    <<: *api_env_file
    build:
      context: ..
      dockerfile: server/Services/ItineraryService/Dockerfile
    ports:
      - "63189:8080"
    environment: *service_env

  bookingservice:
    <<: *api_env_file
    build:
      context: ..
      dockerfile: server/Services/BookingService/Dockerfile
    ports:
      - "63191:8080"
    environment: *service_env

  paymentservice:
    <<: *api_env_file
    build:
      context: ..
      dockerfile: server/Services/PaymentService/Dockerfile
    ports:
      - "63187:8080"
    environment:
      <<: *service_env
      Stripe__SecretKey: "${STRIPE__SECRETKEY:-}"
      Stripe__WebhookSecret: "${STRIPE__WEBHOOKSECRET:-}"
      PayPal__BaseUrl: "${PAYPAL__BASEURL:-https://api-m.sandbox.paypal.com/}"
      PayPal__ClientId: "${PAYPAL__CLIENTID:-}"
      PayPal__ClientSecret: "${PAYPAL__CLIENTSECRET:-}"
      PayPal__WebhookId: "${PAYPAL__WEBHOOKID:-}"

  notificationservice:
    <<: *api_env_file
    build:
      context: ..
      dockerfile: server/Services/NotificationService/Dockerfile
    ports:
      - "62375:8080"
    environment: *service_env

  auditservice:
    <<: *api_env_file
    build:
      context: ..
      dockerfile: server/Services/AuditService/Dockerfile
    ports:
      - "65486:8080"
    environment: *service_env

  realtimecommunicationservice:
    <<: *api_env_file
    build:
      context: ..
      dockerfile: server/Services/RealTimeCommunicationService/Dockerfile
    ports:
      - "62379:8080"
    environment: *service_env

  supportservice:
    <<: *api_env_file
    build:
      context: ..
      dockerfile: server/Services/SupportService/Dockerfile
    ports:
      - "50395:8080"
    environment: *service_env

  weatherexternaldataservice:
    <<: *api_env_file
    build:
      context: ..
      dockerfile: server/Services/WeatherExternalDataService/Dockerfile
    ports:
      - "61219:8080"
    environment:
      <<: *service_env
      ExternalApis__AviationStack__AccessKey: "${EXTERNALAPIS__AVIATIONSTACK__ACCESSKEY:-}"
      ExternalApis__Transport__BaseUrl: "${EXTERNALAPIS__TRANSPORT__BASEURL:-}"
      ExternalApis__Transport__ApiKey: "${EXTERNALAPIS__TRANSPORT__APIKEY:-}"

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - apigateway

volumes:
  mssql-data:
