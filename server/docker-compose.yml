name: travel-assistant

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - mssql-data:/var/opt/mssql

  apigateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    ports:
      - "5161:8080"
    depends_on:
      mssql:
        condition: service_healthy
    environment: &service_env
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "${CONNECTIONSTRINGS__DEFAULTCONNECTION}"
      Jwt__Issuer: "${JWT__ISSUER}"
      Jwt__Audience: "${JWT__AUDIENCE}"
      Jwt__SecretKey: "${JWT__SECRETKEY}"
      Jwt__AccessTokenMinutes: "${JWT__ACCESSTOKENMINUTES:-30}"
      Jwt__RefreshTokenDays: "${JWT__REFRESHTOKENDAYS:-7}"
      Cors__AllowedOrigins__0: "${CORS__ALLOWEDORIGINS__0:-http://localhost:5173}"

  userservice:
    build:
      context: .
      dockerfile: Services/UserService/Dockerfile
    ports:
      - "62381:8080"
    depends_on:
      mssql:
        condition: service_healthy
    environment: *service_env

  itineraryservice:
    build:
      context: .
      dockerfile: Services/ItineraryService/Dockerfile
    ports:
      - "63189:8080"
    depends_on:
      mssql:
        condition: service_healthy
    environment: *service_env

  bookingservice:
    build:
      context: .
      dockerfile: Services/BookingService/Dockerfile
    ports:
      - "63191:8080"
    depends_on:
      mssql:
        condition: service_healthy
    environment: *service_env

  paymentservice:
    build:
      context: .
      dockerfile: Services/PaymentService/Dockerfile
    ports:
      - "63187:8080"
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      <<: *service_env
      Stripe__SecretKey: "${STRIPE__SECRETKEY:-}"
      Stripe__WebhookSecret: "${STRIPE__WEBHOOKSECRET:-}"
      PayPal__BaseUrl: "${PAYPAL__BASEURL:-https://api-m.sandbox.paypal.com/}"
      PayPal__ClientId: "${PAYPAL__CLIENTID:-}"
      PayPal__ClientSecret: "${PAYPAL__CLIENTSECRET:-}"

  notificationservice:
    build:
      context: .
      dockerfile: Services/NotificationService/Dockerfile
    ports:
      - "62375:8080"
    depends_on:
      mssql:
        condition: service_healthy
    environment: *service_env

  auditservice:
    build:
      context: .
      dockerfile: Services/AuditService/Dockerfile
    ports:
      - "65486:8080"
    depends_on:
      mssql:
        condition: service_healthy
    environment: *service_env

  realtimecommunicationservice:
    build:
      context: .
      dockerfile: Services/RealTimeCommunicationService/Dockerfile
    ports:
      - "62379:8080"
    depends_on:
      mssql:
        condition: service_healthy
    environment: *service_env

  supportservice:
    build:
      context: .
      dockerfile: Services/SupportService/Dockerfile
    ports:
      - "50395:8080"
    depends_on:
      mssql:
        condition: service_healthy
    environment: *service_env

  weatherexternaldataservice:
    build:
      context: .
      dockerfile: Services/WeatherExternalDataService/Dockerfile
    ports:
      - "61219:8080"
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      <<: *service_env
      ExternalApis__AviationStack__AccessKey: "${EXTERNALAPIS__AVIATIONSTACK__ACCESSKEY:-}"

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - apigateway

volumes:
  mssql-data:
